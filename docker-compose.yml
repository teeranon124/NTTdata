# ==========================================================================
# AutoProcure.AI — local production-like stack (web + PostgreSQL 16)
# Usage:  docker compose up --build
#         Web -> http://localhost:8080
# ==========================================================================
services:
  db:
    image: postgres:16-alpine
    container_name: autoprocure-db
    environment:
      POSTGRES_USER: autoprocure
      POSTGRES_PASSWORD: autoprocure_pw
      POSTGRES_DB: autoprocure
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoprocure -d autoprocure"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: autoprocure-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoprocure-web
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Enterprise mode: PostgreSQL via the ORM layer. Tables auto-create + seed on boot.
      USE_DATABASE: "true"
      DATABASE_URL: "postgresql+psycopg2://autoprocure:autoprocure_pw@db:5432/autoprocure"
      # Redis makes SSE events correct across the 2 Gunicorn workers below.
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "autoprocure_secret_key_nttdata_2026"
      FLASK_DEBUG: "0"
      # Enables the demo clean-slate endpoint POST /api/admin/reset-sessions.
      ADMIN_RESET_TOKEN: "change-me-before-demo"
      # AWS Bedrock/SES are optional — leave unset to run deterministic fallback.
      # AWS_ACCESS_KEY_ID: "..."
      # AWS_SECRET_ACCESS_KEY: "..."
      # AWS_DEFAULT_REGION: "us-east-1"
      # SES_ENABLED: "false"
      WEB_CONCURRENCY: "2"
      GUNICORN_THREADS: "8"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/events"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
